name: Data safety tests
on:
  push:
    branches: ["fix/**", "polish/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=$(python3 - <<'PY'
          import pathlib, re, subprocess
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              result = subprocess.run([str(path / 'Contents/Developer/usr/bin/xcodebuild'), '-version'], capture_output=True, text=True)
              match = re.search(r'^Xcode (\d+(?:\.\d+)*)\s*$', result.stdout, re.M)
              if result.returncode == 0 and match and not re.search(r'beta|rc|preview', path.name, re.I):
                  candidates.append((tuple(map(int, match.group(1).split('.'))), str(path)))
          if not candidates:
              raise SystemExit('No stable installed Xcode found')
          print(max(candidates)[1])
          PY
          )
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee xcode-version.log
          xcodebuild -list -project PanelReader.xcodeproj | tee project-list.log
      - name: Run iPad unit tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad" in x["name"]))')
          xcodebuild -project PanelReader.xcodeproj -scheme PanelReaderTests -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: tests.log
