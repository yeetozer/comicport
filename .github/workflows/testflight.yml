name: TestFlight upload
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to upload
        type: choice
        options: [both, ipad, mac-catalyst]
        default: both
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    name: ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'ipad' && '[{"platform":"ipad","destination":"generic/platform=iOS"}]' || inputs.platform == 'mac-catalyst' && '[{"platform":"mac-catalyst","destination":"generic/platform=macOS,variant=Mac Catalyst"}]' || '[{"platform":"ipad","destination":"generic/platform=iOS"},{"platform":"mac-catalyst","destination":"generic/platform=macOS,variant=Mac Catalyst"}]') }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PLATFORM: ${{ matrix.platform }}
      DESTINATION: ${{ matrix.destination }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Select newest stable installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=$(python3 - <<'PY'
          import pathlib, re, subprocess
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              result = subprocess.run([str(path / 'Contents/Developer/usr/bin/xcodebuild'), '-version'], capture_output=True, text=True)
              match = re.search(r'^Xcode (\d+(?:\.\d+)*)\s*$', result.stdout, re.M)
              if result.returncode == 0 and match and not re.search(r'beta|rc|preview', path.name, re.I):
                  candidates.append((tuple(map(int, match.group(1).split('.'))), str(path)))
          if not candidates:
              raise SystemExit('No stable installed Xcode found')
          print(max(candidates)[1])
          PY
          )
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee xcode-version.log
          xcodebuild -list -project PanelReader.xcodeproj | tee project-list.log
      - name: Write authentication key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          python3 - <<'PY'
          import base64, os, pathlib
          key = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'private_keys' / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          path.write_bytes(key)
          path.chmod(0o600)
          PY
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project PanelReader.xcodeproj -scheme 'ComicPort Mac' -configuration Release \
            -destination "$DESTINATION" -archivePath "$RUNNER_TEMP/ComicPort-$PLATFORM.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "archive-$PLATFORM.log"
      - name: Export local package for signing report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          options = {'method': 'app-store-connect', 'destination': 'export',
                     'teamID': os.environ['APPLE_TEAM_ID'], 'signingStyle': 'automatic',
                     'uploadSymbols': True, 'manageAppVersionAndBuildNumber': False}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ExportOptions-local.plist'
          with path.open('wb') as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ComicPort-$PLATFORM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-local.plist" -exportPath "$RUNNER_TEMP/export-local" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "export-local-$PLATFORM.log"
      - name: Export and upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          options = {'method': 'app-store-connect', 'destination': 'upload',
                     'teamID': os.environ['APPLE_TEAM_ID'], 'signingStyle': 'automatic',
                     'uploadSymbols': True, 'manageAppVersionAndBuildNumber': False}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist'
          with path.open('wb') as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ComicPort-$PLATFORM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "upload-$PLATFORM.log"
      - name: Report exported package signing
        id: signing-report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "$PLATFORM" == ipad ]]; then
            packages=("$RUNNER_TEMP/export-local/"*.ipa)
          else
            packages=("$RUNNER_TEMP/export-local/"*.pkg)
          fi
          if (( ${#packages[@]} == 0 )); then
            printf 'No exported package found; signing report skipped.\n'
            exit 0
          fi
          printf 'package_exists=true\n' >> "$GITHUB_OUTPUT"
          python3 - "${packages[@]}" <<'PY' 2>&1 | tee "signing-$PLATFORM.log"
          import os, pathlib, plistlib, subprocess, sys, tempfile

          def command(args):
              result = subprocess.run(args, capture_output=True, text=True)
              print(result.stdout, end='')
              print(result.stderr, end='')
              print(f'Exit status: {result.returncode}')
              return result.returncode

          def inspect(bundle):
              print(f'\nBundle: {bundle}')
              catalyst = os.environ['PLATFORM'] == 'mac-catalyst'
              info = bundle / ('Contents/Info.plist' if catalyst else 'Info.plist')
              print('CFBundleIdentifier:')
              command(['/usr/libexec/PlistBuddy', '-c', 'Print :CFBundleIdentifier', str(info)])
              profile = bundle / ('Contents/embedded.provisionprofile' if catalyst else 'embedded.mobileprovision')
              if profile.exists():
                  # Decode privately; never print the full profile or DeveloperCertificates.
                  decoded = subprocess.run(['security', 'cms', '-D', '-i', str(profile)], capture_output=True)
                  print(f'Profile decode exit status: {decoded.returncode}')
                  if decoded.returncode == 0:
                      try:
                          data = plistlib.loads(decoded.stdout)
                          for field in ('Name', 'TeamIdentifier', 'ExpirationDate', 'ProvisionsAllDevices'):
                              print(f'{field}: {data.get(field, "<absent>")}')
                          devices = 'ProvisionedDevices' in data
                          print(f'ProvisionedDevices exists: {devices} (must be False for App Store)')
                          print('Entitlements:')
                          for key, value in sorted(data.get('Entitlements', {}).items()):
                              print(f'  {key}: {value!r}')
                      except Exception as error:
                          print(f'Profile parsing failed: {type(error).__name__}')
              else:
                  print('Embedded provisioning profile: absent')
              print('Code signature entitlements:')
              command(['codesign', '-d', '--entitlements', ':-', str(bundle)])
              print('Code signature verification:')
              command(['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(bundle)])

          for package in map(pathlib.Path, sys.argv[1:]):
              print(f'\nPackage: {package.name}')
              with tempfile.TemporaryDirectory(prefix='testflight-signing-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  root = pathlib.Path(temporary)
                  if os.environ['PLATFORM'] == 'ipad':
                      if command(['unzip', '-q', str(package), '-d', str(root)]) != 0:
                          continue
                      apps = sorted((root / 'Payload').glob('*.app'))
                  else:
                      print('Installer signature:')
                      command(['pkgutil', '--check-signature', str(package)])
                      expanded = root / 'expanded'
                      if command(['pkgutil', '--expand-full', str(package), str(expanded)]) != 0:
                          continue
                      apps = sorted(expanded.rglob('*.app'))
                  if not apps:
                      print('No application bundle found in exported package.')
                  for app in apps:
                      inspect(app)
                      for extension in sorted(app.rglob('PlugIns/*.appex')):
                          inspect(extension)
          PY
      - name: Keep exported package and signing report
        if: always() && steps.signing-report.outputs.package_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-package-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/export-local/*.ipa
            ${{ runner.temp }}/export-local/*.pkg
            signing-${{ matrix.platform }}.log
          retention-days: 7
          if-no-files-found: warn
      - name: Delete authentication key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private_keys"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ matrix.platform }}
          path: '*.log'
          if-no-files-found: warn
      - name: Job summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          printf '## TestFlight upload\n\nPlatform: %s\n\nVersion: 1.0.0\n\nBuild: %s\n\nResult: %s\n' \
            "$PLATFORM" "$BUILD_NUMBER" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
