name: Read-only App Store Connect diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Prepare private key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then printf '::error::Missing %s\n' "$name"; exit 1; fi
          done
          printf '::add-mask::%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID"
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc-diagnostic.p8'
          path.write_bytes(base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Install JWT dependencies
        run: python3 -m pip install pyjwt cryptography
      - name: GET-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, time, urllib.parse, urllib.request, urllib.error
          import jwt
          keypath = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc-diagnostic.p8'
          token = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time()) + 900, 'aud': 'appstoreconnect-v1'}, keypath.read_bytes(), algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          report = {'apps': [], 'builds': [], 'groups': [], 'testers': [], 'review_details': [], 'localizations': [], 'store_versions': [], 'availability': [], 'endpoint_errors': []}
          def clean(value):
              if isinstance(value, dict):
                  return {k: ('[masked]' if any(s in k.lower() for s in ('phone', 'password')) else clean(v)) for k,v in value.items()}
              if isinstance(value, list): return [clean(v) for v in value]
              if isinstance(value, str):
                  for secret in (os.environ['ASC_KEY_ID'], os.environ['ASC_ISSUER_ID']): value = value.replace(secret, '[masked]')
                  return re.sub(r"([^\s@]+)@([A-Za-z0-9.-]+)", lambda m: m[1][:1] + '***@' + m[2], value)
              return value
          def get(path, params=None):
              url = 'https://api.appstoreconnect.apple.com' + path
              if params: url += '?' + urllib.parse.urlencode(params)
              if not url.startswith('https://api.appstoreconnect.apple.com/'): raise ValueError('Invalid origin')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token}, method='GET'), timeout=60) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  try: errors = json.load(error).get('errors', [])
                  except Exception: errors = []
                  message = clean(f"GET {path}: HTTP {error.code} " + '; '.join(e.get('title','') + ': ' + e.get('detail','') for e in errors))
                  report['endpoint_errors'].append(message); print(message)
                  return {'data': []}
          def rows(path, params=None):
              result = get(path, params)
              data = result.get('data') or []
              if isinstance(data, dict): data = [data]
              while result.get('links', {}).get('next'):
                  next_url = result['links']['next']
                  parsed = urllib.parse.urlparse(next_url)
                  if parsed.netloc != 'api.appstoreconnect.apple.com': raise ValueError('Invalid pagination origin')
                  result = get(parsed.path + ('?' + parsed.query if parsed.query else ''))
                  data.extend(result.get('data', []))
              return data
          def attrs(item): return {'id': item['id'], **clean(item.get('attributes', {}))}
          apps = rows('/v1/apps', {'filter[bundleId]': 'com.yeetozer.comicport'})
          for app in apps:
              aid = app['id']; a = app.get('attributes', {})
              report['apps'].append({'id': aid, **{k:a.get(k) for k in ('name','primaryLocale','contentRightsDeclaration')}})
              result = get('/v1/builds', {'filter[app]': aid, 'include': 'preReleaseVersion,buildBetaDetail', 'limit': 20})
              included = {(i['type'],i['id']): i for i in result.get('included', [])}
              for build in result.get('data', []):
                  b = attrs(build); rel = build.get('relationships', {})
                  for name in ('preReleaseVersion','buildBetaDetail'):
                      ref = rel.get(name, {}).get('data')
                      if ref: b[name] = clean(included.get((ref['type'],ref['id']), {}).get('attributes', {}))
                  b['buildBundles'] = [attrs(x) for x in rows('/v1/builds/' + build['id'] + '/buildBundles')]
                  if not b['buildBundles']:
                      bundles = get('/v1/builds/' + build['id'], {'include':'buildBundles'})
                      b['buildBundles'] = [attrs(x) for x in bundles.get('included', []) if x['type'] == 'buildBundles']
                  b['appEncryptionDeclaration'] = [attrs(x) for x in rows('/v1/builds/' + build['id'] + '/appEncryptionDeclaration')]
                  report['builds'].append(b)
              for group in rows('/v1/apps/' + aid + '/betaGroups', {'limit':200}):
                  g = attrs(group); gid = group['id']
                  g['builds'] = [attrs(x) for x in rows('/v1/betaGroups/' + gid + '/builds', {'limit':200})]
                  report['groups'].append(g)
                  for tester in rows('/v1/betaGroups/' + gid + '/betaTesters', {'limit':200}):
                      t = tester.get('attributes', {})
                      report['testers'].append({'group_id': gid, 'group_name':g.get('name'), 'id':tester['id'], **clean({k:t.get(k) for k in ('inviteType','state','firstName','email')})})
              report['review_details'].extend(attrs(x) for x in rows('/v1/betaAppReviewDetails', {'filter[app]':aid}))
              for loc in rows('/v1/betaAppLocalizations', {'filter[app]':aid}):
                  a = loc.get('attributes', {})
                  report['localizations'].append({'locale':a.get('locale'), 'feedbackEmailSet':bool(a.get('feedbackEmail')), 'privacyPolicyUrlSet':bool(a.get('privacyPolicyUrl'))})
              report['store_versions'].extend(attrs(x) for x in rows('/v1/apps/' + aid + '/appStoreVersions', {'limit':10}))
              availability = get('/v1/apps/' + aid, {'include':'appAvailability'})
              report['availability'].extend(attrs(x) for x in availability.get('included', []))
              for av in rows('/v1/apps/' + aid + '/appAvailabilityV2'):
                  entry = attrs(av)
                  entry['territories'] = [attrs(x) for x in rows('/v2/appAvailabilities/' + av['id'] + '/territoryAvailabilities', {'include':'territory', 'limit':200})]
                  report['availability'].append(entry)
          report = clean(report)
          pathlib.Path('asc-diagnostic.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-diagnostic.p8"
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-diagnostic
          path: asc-diagnostic.json
          if-no-files-found: warn
