# Manual only: never uploads to App Store Connect or publishes the IPA.
name: Ad Hoc iPad IPA
'on':
  workflow_dispatch:
    inputs:
      udid:
        description: Optional iPad UDID (registration consumes an annual device slot)
        type: string
        required: false
        default: ''
      device_name:
        description: Optional name for a newly registered iPad
        type: string
        required: false
        default: ''
      base_url:
        description: Public HTTPS directory for ComicPort.ipa and manifest.plist; empty uses a placeholder
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: comicport-adhoc
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PLATFORM: ipad
      DESTINATION: generic/platform=iOS
      DEVICE_UDID: ${{ inputs.udid }}
      DEVICE_NAME: ${{ inputs.device_name }}
      BASE_URL: ${{ inputs.base_url }}
    steps:
    - name: Check required secrets
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
          if [[ -z "${!name}" ]]; then missing+=("$name"); fi
        done
        if (( ${#missing[@]} )); then
          printf '::error::Missing required repository secrets: %s\n' "${missing[*]}"
          exit 1
        fi
    - uses: actions/checkout@v4
    - name: Select newest stable installed Xcode
      shell: bash
      run: |
        set -euo pipefail
        XCODE_PATH=$(python3 - <<'PY'
        import pathlib, re, subprocess
        candidates = []
        for path in pathlib.Path('/Applications').glob('Xcode*.app'):
            result = subprocess.run([str(path / 'Contents/Developer/usr/bin/xcodebuild'), '-version'], capture_output=True, text=True)
            match = re.search(r'^Xcode (\d+(?:\.\d+)*)\s*$', result.stdout, re.M)
            if result.returncode == 0 and match and not re.search(r'beta|rc|preview', path.name, re.I):
                candidates.append((tuple(map(int, match.group(1).split('.'))), str(path)))
        if not candidates:
            raise SystemExit('No stable installed Xcode found')
        print(max(candidates)[1])
        PY
        )
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        xcodebuild -version | tee xcode-version.log
        xcodebuild -list -project PanelReader.xcodeproj | tee project-list.log
    - name: Write authentication key
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$RUNNER_TEMP/private_keys"
        python3 - <<'PY'
        import base64, os, pathlib
        key = base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True)
        path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'private_keys' / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
        path.write_bytes(key)
        path.chmod(0o600)
        PY
    - name: Set isolated build number
      shell: bash
      run: |
        set -euo pipefail
        # Dotted namespace cannot equal TestFlight's single-component run_number.
        # Re-runs retain a build number; these packages are never uploaded to ASC.
        printf 'BUILD_NUMBER=1000.%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
    - name: Register optional device
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        u = os.environ['DEVICE_UDID'].strip()
        if u:
            if any(c not in '0123456789abcdefABCDEF-' for c in u) or len(u) not in (25, 40):
                raise SystemExit('Invalid UDID format (value withheld)')
            print('::add-mask::' + u)
            print('Device suffix: ' + u[-4:])
        PY
        if [[ -z "$DEVICE_UDID" ]]; then exit 0; fi
        python3 -m venv "$RUNNER_TEMP/asc-venv"
        "$RUNNER_TEMP/asc-venv/bin/pip" -q install 'PyJWT[crypto]==2.10.1'
        "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
        import json, os, pathlib, time, urllib.request, urllib.parse, urllib.error
        import jwt
        u = os.environ['DEVICE_UDID'].strip()
        key = (pathlib.Path(os.environ['RUNNER_TEMP'])/'private_keys'/f"AuthKey_{os.environ['ASC_KEY_ID']}.p8").read_bytes()
        token = jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+600,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
        print('::add-mask::' + token)
        def request(path, data=None):
            req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/'+path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='GET' if data is None else 'POST')
            try:
                with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
            except urllib.error.HTTPError as error:
                raise SystemExit(f'ASC request failed: HTTP {error.code}; response withheld to protect device identifiers')
        path='devices?'+urllib.parse.urlencode({'filter[udid]':u})
        existing=request(path)['data']
        if not existing:
            request('devices',{'data':{'type':'devices','attributes':{'udid':u,'platform':'IOS','name':os.environ['DEVICE_NAME'].strip() or 'ComicPort iPad'}}})
            existing=request(path)['data']
            if not existing: raise SystemExit('Device registration read-back failed')
            print('Device registered (suffix '+u[-4:]+')')
        else: print('Device already registered (suffix '+u[-4:]+')')
        if any(d['attributes'].get('status') != 'ENABLED' for d in existing):
            raise SystemExit('Registered device is disabled; enable it in the developer account before building')
        PY
    - name: Archive
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild archive -project PanelReader.xcodeproj -scheme 'ComicPort Mac' -configuration Release \
          -destination "$DESTINATION" -archivePath "$RUNNER_TEMP/ComicPort-$PLATFORM.xcarchive" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
          2>&1 | tee "archive-$PLATFORM.log"
    - name: Export Ad Hoc package
      shell: bash
      run: |
        set -euo pipefail
        # Only retry the deprecated spelling if this Xcode rejects release-testing.
        for method in release-testing ad-hoc; do
          EXPORT_METHOD="$method" python3 - <<'PY'
        import os, pathlib, plistlib
        options={'method':os.environ['EXPORT_METHOD'],'destination':'export','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'automatic','manageAppVersionAndBuildNumber':False,'stripSwiftSymbols':True,'thinning':'<none>'}
        with (pathlib.Path(os.environ['RUNNER_TEMP'])/'ExportOptions-adhoc.plist').open('wb') as f: plistlib.dump(options,f)
        PY
          if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ComicPort-ipad.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-adhoc.plist" -exportPath "$RUNNER_TEMP/export-adhoc" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export-adhoc.log" 2>&1; then
            break
          fi
          if [[ "$method" == ad-hoc ]] || ! python3 - <<'PY'
        import os, pathlib, re
        text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'export-adhoc.log').read_text()
        raise SystemExit(0 if re.search(r'(method|release-testing).*(invalid|unsupported|expected|unknown)|(invalid|unsupported|expected|unknown).*release-testing',text,re.I) else 1)
        PY
          then
            printf '::error::Ad Hoc export failed; raw export log retained only on the ephemeral runner (may contain device identifiers).\n'
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/export-adhoc"
        done
    - name: Verify signing and generate manifest
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' | tee signing-adhoc.log
        import os, pathlib, plistlib, shutil, subprocess, tempfile, urllib.parse, zipfile
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        packages=list((root/'export-adhoc').glob('*.ipa'))
        if len(packages)!=1: raise SystemExit('Expected exactly one exported IPA')
        out=root/'comicport-adhoc';out.mkdir(exist_ok=True)
        with tempfile.TemporaryDirectory(dir=root) as tmp:
            with zipfile.ZipFile(packages[0]) as z: z.extractall(tmp)
            apps=list((pathlib.Path(tmp)/'Payload').glob('*.app'))
            if len(apps)!=1: raise SystemExit('Expected exactly one app')
            app=apps[0];info=plistlib.loads((app/'Info.plist').read_bytes())
            bundles=[app,*sorted(app.rglob('*.appex'))]
            expected={'com.yeetozer.comicport','com.yeetozer.comicport.widgets'}
            found=set()
            for bundle in bundles:
                meta=plistlib.loads((bundle/'Info.plist').read_bytes());found.add(meta['CFBundleIdentifier'])
                if meta['CFBundleVersion']!=os.environ['BUILD_NUMBER']: raise SystemExit('Bundle build number mismatch')
                decoded=subprocess.run(['security','cms','-D','-i',str(bundle/'embedded.mobileprovision')],capture_output=True,check=True)
                p=plistlib.loads(decoded.stdout);devices=p.get('ProvisionedDevices',[])
                print('Bundle:',meta['CFBundleIdentifier'])
                for field in ('Name','ProvisionsAllDevices','ExpirationDate'): print(field+':',p.get(field,'<absent>'))
                print('ProvisionedDevices count:',len(devices))
                if not devices or p.get('ProvisionsAllDevices') or p.get('Entitlements',{}).get('get-task-allow',False): raise SystemExit('Not an Ad Hoc distribution profile')
                udid=os.environ['DEVICE_UDID'].strip()
                if udid and udid not in devices: raise SystemExit('Requested device missing from an embedded profile')
                subprocess.run(['codesign','--verify','--deep','--strict','--verbose=2',str(bundle)],check=True)
            if found!=expected: raise SystemExit('Unexpected app/extension identifiers')
            base=os.environ['BASE_URL'].strip().rstrip('/') or 'https://YOUR-HTTPS-HOST.example/comicport'
            parsed=urllib.parse.urlsplit(base)
            if parsed.scheme!='https' or not parsed.hostname or parsed.query or parsed.fragment or parsed.username: raise SystemExit('base_url must be an HTTPS directory URL without credentials, query or fragment')
            manifest={'items':[{'assets':[{'kind':'software-package','url':base+'/ComicPort.ipa'}],'metadata':{'bundle-identifier':'com.yeetozer.comicport','bundle-version':info['CFBundleVersion'],'kind':'software','title':'ComicPort'}}]}
            with (out/'manifest.plist').open('wb') as f: plistlib.dump(manifest,f)
            shutil.copy2(packages[0],out/'ComicPort.ipa')
            link='itms-services://?action=download-manifest&url='+urllib.parse.quote(base+'/manifest.plist',safe='')
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                f.write('## ComicPort Ad Hoc\nBuild: '+info['CFBundleVersion']+'\n\nUpload ComicPort.ipa and manifest.plist to the chosen trusted HTTPS directory. No files are published by this workflow.\n\nOTA link: `'+link+'`\n\nAn empty base_url produces a placeholder: regenerate or edit the manifest before installing. Enable Developer Mode on the iPad.\n')
        PY
    - name: Keep IPA and OTA manifest
      uses: actions/upload-artifact@v4
      with:
        name: comicport-adhoc
        path: |-
          ${{ runner.temp }}/comicport-adhoc/ComicPort.ipa
          ${{ runner.temp }}/comicport-adhoc/manifest.plist
          signing-adhoc.log
        retention-days: 7
        if-no-files-found: error
    - name: Delete authentication key
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/private_keys"
